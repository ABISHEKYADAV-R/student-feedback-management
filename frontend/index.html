<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Student Feedback System</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="auth-page">
    <div class="auth-container">
      <div class="auth-card">
        <div class="auth-header">
          <div class="logo-icon">&#127979;</div>
          <h1>Smart Feedback System</h1>
          <p>College Student Feedback Portal</p>
        </div>

        <form id="loginForm" class="auth-form">
          <div class="form-group">
            <label for="email">Email Address</label>
            <input
              type="email"
              id="email"
              placeholder="Enter your email"
              required />
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              placeholder="Enter your password"
              required />
          </div>

          <div id="loginError" class="alert alert-error hidden"></div>

          <button type="submit" class="btn btn-primary btn-block" id="loginBtn">
            Login
          </button>
        </form>

        <div class="auth-footer">
          <p>Demo credentials:</p>
          <small>Admin: admin@college.com / admin123</small><br />
          <small>Faculty: smith@college.com / faculty123</small><br />
          <small>Student: alice@student.com / student123</small>
        </div>
      </div>
    </div>

    <script src="js/auth.js"></script>
  </body>
</html>
