<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Student Feedback System</title>
    <meta name="theme-color" content="#4361ee" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="auth-page">
    <div class="auth-container">
      <div class="auth-card">
        <div class="auth-header">
          <span class="logo-icon">&#127979;</span>
          <h1>Smart Feedback System</h1>
          <p>College Student Feedback Portal</p>
        </div>

        <form id="loginForm" class="auth-form">
          <div class="form-group">
            <label for="email">Email Address</label>
            <input
              type="email"
              id="email"
              placeholder="Enter your email"
              autocomplete="email"
              required />
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <div class="password-wrapper">
              <input
                type="password"
                id="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required />
              <button
                type="button"
                class="toggle-pwd"
                id="togglePwd"
                title="Show/hide password">
                &#128065;
              </button>
            </div>
          </div>
          <div class="form-group">
            <label for="role">Role</label>
            <select id="role" required>
              <option value="">Select your role</option>
              <option value="student">Student</option>
              <option value="faculty">Faculty</option>
              <option value="admin">Admin</option>
            </select>
          </div>

          <div id="loginError" class="alert alert-error hidden"></div>

          <button type="submit" class="btn btn-primary btn-block" id="loginBtn">
            Login
          </button>
        </form>

        <div class="auth-footer">
          <p style="margin-bottom: 8px; font-weight: 600; color: #475569">
            Demo Credentials
          </p>
          <span class="cred-item">admin@college.com / admin123</span><br />
          <span class="cred-item">smith@college.com / faculty123</span><br />
          <span class="cred-item">alice@student.com / student123</span>
        </div>
      </div>
    </div>

    <script src="js/auth.js"></script>
  </body>
</html>
