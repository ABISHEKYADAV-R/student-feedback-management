<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Faculty Dashboard - Smart Feedback System</title>
  <meta name="theme-color" content="#4361ee" />
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <!-- Navigation -->
  <nav class="navbar">
    <div class="nav-brand">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round" style="margin-right: 6px;">
        <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
        <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
      </svg>
      Smart Feedback System
    </div>
    <div class="nav-right">
      <span class="nav-user" id="navUser"></span>
      <button class="btn btn-outline btn-sm" onclick="logout()">
        Logout
      </button>
    </div>
  </nav>

  <div class="container">
    <div class="page-header">
      <h2>Faculty Dashboard</h2>
      <p>View feedback and ratings for your courses.</p>
    </div>

    <!-- Summary Cards -->
    <div class="stats-grid" id="summaryCards">
      <div class="stat-card loading-card">
        <span class="spinner"></span> Loading...
      </div>
    </div>

    <!-- Feedback per course -->
    <div class="card">
      <h3>Course Feedback Details</h3>
      <p class="text-muted" id="noDataMsg">No feedback data available yet.</p>
      <div id="courseCards"></div>
    </div>

    <!-- Recent Comments -->
    <div class="card">
      <h3>Recent Student Comments</h3>
      <p class="text-muted">Latest anonymous comments from students.</p>
      <div id="commentsList">
        <p class="loading">
          <span class="spinner"></span> Loading comments...
        </p>
      </div>
    </div>
  </div>

  <script src="js/faculty.js"></script>
</body>

</html>
