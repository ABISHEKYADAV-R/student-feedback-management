<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Faculty Dashboard - Smart Feedback System</title>
  <meta name="description" content="Faculty dashboard for viewing student feedback, ratings, and course analytics." />
  <meta name="theme-color" content="#6366f1" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/theme.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
  <!-- Navigation -->
  <nav class="navbar">
    <div class="nav-brand">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round" style="margin-right: 6px;">
        <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
        <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
      </svg>
      Smart Feedback System
    </div>
    <div class="nav-right">
      <button class="btn btn-outline btn-sm theme-toggle" title="Toggle Theme"
        style="border-radius: 50%; padding: 4px 8px; font-size: 1.1rem;">
        <span class="icon">☀️</span>
      </button>
      <span class="nav-user" id="navUser"></span>
      <span class="nav-role-badge">Faculty</span>
      <button class="btn btn-outline btn-sm" onclick="logout()">
        Logout
      </button>
    </div>
  </nav>

  <!-- Toast container -->
  <div class="toast-container" id="toastContainer"></div>

  <div class="container">
    <!-- Welcome Banner -->
    <div class="welcome-banner animate-in">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
        <circle cx="8.5" cy="7" r="4"></circle>
        <line x1="20" y1="8" x2="20" y2="14"></line>
        <line x1="23" y1="11" x2="17" y2="11"></line>
      </svg>
      <div>
        <h2 id="welcomeTitle">Faculty Dashboard</h2>
        <p>View feedback and ratings for your courses.</p>
      </div>
    </div>

    <!-- Summary Cards -->
    <div class="stats-grid" id="summaryCards">
      <div class="stat-card loading-card">
        <span class="spinner"></span> Loading...
      </div>
    </div>

    <!-- Rating Distribution Chart -->
    <div class="dashboard-grid-2">
      <div class="card animate-in">
        <h3>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="20" x2="18" y2="10"></line>
            <line x1="12" y1="20" x2="12" y2="4"></line>
            <line x1="6" y1="20" x2="6" y2="14"></line>
          </svg>
          Rating Distribution
        </h3>
        <canvas id="ratingChart" style="max-height: 260px;"></canvas>
      </div>
      <div class="card animate-in">
        <h3>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
          Quick Summary
        </h3>
        <div id="quickSummary">
          <p class="loading"><span class="spinner"></span> Loading...</p>
        </div>
      </div>
    </div>

    <!-- Feedback per course -->
    <div class="card animate-in">
      <h3>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
          <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
        </svg>
        Course Feedback Details
      </h3>
      <p class="text-muted" id="noDataMsg">No feedback data available yet.</p>
      <div id="courseCards"></div>
    </div>

    <!-- Recent Comments -->
    <div class="card animate-in">
      <h3>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
        Recent Student Comments
      </h3>
      <p class="text-muted">Latest anonymous comments from students.</p>
      <div id="commentsList">
        <p class="loading">
          <span class="spinner"></span> Loading comments...
        </p>
      </div>
    </div>
  </div>

  <script src="js/faculty.js"></script>
</body>

</html>
